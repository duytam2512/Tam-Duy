    <!-- Suppress Vite HMR WebSocket in AI Studio Cloud Run dev environment -->
    <script>
      (function () {
        if (typeof window !== 'undefined') {
          window.addEventListener('unhandledrejection', function (e) {
            if (
              e.reason &&
              (e.reason.message?.includes('WebSocket') ||
               e.reason.message?.includes('vite') ||
               String(e.reason).includes('WebSocket closed without opened'))
            ) {
              e.preventDefault();
              e.stopImmediatePropagation();
            }
          });
          window.addEventListener('error', function (e) {
            if (
              e.message?.includes('WebSocket') ||
              e.message?.includes('vite') ||
              e.error?.message?.includes('WebSocket')
            ) {
              e.preventDefault();
              e.stopImmediatePropagation();
            }
          });

          if (window.WebSocket) {
            var NativeWS = window.WebSocket;
            function DummyViteWS() {
              var target = new EventTarget();
              target.readyState = 1;
              target.OPEN = 1;
              target.CONNECTING = 0;
              target.CLOSING = 2;
              target.CLOSED = 3;
              target.send = function () {};
              target.close = function () {};
              setTimeout(function () {
                target.dispatchEvent(new Event('open'));
              }, 0);
              return target;
            }
            DummyViteWS.prototype = NativeWS.prototype;

            window.WebSocket = function (url, protocols) {
              if (
                protocols === 'vite-hmr' ||
                (typeof url === 'string' && (url.includes('vite-hmr') || url.includes('token=')))
              ) {
                return new DummyViteWS();
              }
              return new NativeWS(url, protocols);
            };
            window.WebSocket.prototype = NativeWS.prototype;
            window.WebSocket.CONNECTING = 0;
            window.WebSocket.OPEN = 1;
            window.WebSocket.CLOSING = 2;
            window.WebSocket.CLOSED = 3;
          }
        }
      })();
    </script>
