<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Góc Nhỏ Bình Yên • Nơi Lưu Giữ Kỷ Niệm Của Hai Đứa</title>
  <meta name="description" content="Album kỷ niệm tình yêu lãng mạn, đếm ngày yêu nhau và lưu giữ từng khoảnh khắc ngọt ngào của hai đứa.">

  <!-- 1. Tailwind CSS qua CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- 2. Lucide Icons qua CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- 3. Google Fonts: Plus Jakarta Sans, Playfair Display, Caveat -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <script>
    // Cấu hình màu sắc Pastel cho Tailwind
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            cream: '#FFFDF9',
            beige: '#F9F6F0',
            rosePastel: '#E8A598',
            roseDeep: '#D98A76',
            wood: '#8C6D58',
            espresso: '#3D2E28'
          },
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            serif: ['"Playfair Display"', 'serif'],
            handwriting: ['"Caveat"', 'cursive']
          }
        }
      }
    }
  </script>

  <style>
    /* Nền Pastel ấm áp */
    body {
      background-color: #FFFDF9;
      color: #3D2E28;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    .card-pastel {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(140, 109, 88, 0.15);
      box-shadow: 0 10px 25px -5px rgba(140, 109, 88, 0.08);
    }
    .polaroid-card {
      background: #ffffff;
      padding: 12px 12px 24px 12px;
      box-shadow: 0 8px 20px -4px rgba(61, 46, 40, 0.1);
      border: 1px solid rgba(140, 109, 88, 0.12);
      transition: all 0.3s ease;
    }
    .polaroid-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 16px 30px -6px rgba(61, 46, 40, 0.15);
    }
  </style>
</head>
<body class="bg-[#FFFDF9] min-h-screen selection:bg-rosePastel/30 selection:text-espresso">

  <!-- HEADER & HERO SECTION -->
  <header class="pt-8 pb-6 px-4 max-w-5xl mx-auto text-center">
    <!-- Huy hiệu nhỏ -->
    <div class="inline-flex items-center gap-2 text-xs font-semibold text-wood bg-[#F9F6F0] px-4 py-1.5 rounded-full border border-wood/15 mb-4">
      <i data-lucide="heart" class="w-4 h-4 text-rosePastel fill-rosePastel animate-pulse"></i>
      <span>Kho Kỷ Niệm Của Hai Đứa</span>
    </div>

    <!-- Tên hai người -->
    <div class="inline-flex items-center gap-3 mb-2 bg-white px-5 py-1.5 rounded-full border border-rosePastel/30 shadow-xs">
      <span id="name-one" class="font-serif font-bold text-lg text-espresso">Anh</span>
      <i data-lucide="heart" class="w-4 h-4 text-rosePastel fill-rosePastel"></i>
      <span id="name-two" class="font-serif font-bold text-lg text-espresso">Em</span>
    </div>

    <!-- Tiêu đề & Dòng phụ -->
    <h1 class="font-serif text-3xl sm:text-5xl font-bold text-espresso tracking-tight mb-2">
      Góc Nhỏ Bình Yên
    </h1>
    <p class="font-handwriting text-xl sm:text-2xl text-wood max-w-lg mx-auto mb-6">
      "Nơi lưu giữ từng khoảnh khắc và kỷ niệm dịu dàng của hai đứa."
    </p>

    <!-- ĐỒNG HỒ ĐẾM NGÀY YÊU NHAU (Love Days Counter) -->
    <div class="card-pastel rounded-3xl p-5 sm:p-7 max-w-xl mx-auto my-6 text-center">
      <div class="text-xs uppercase tracking-wider text-wood font-semibold mb-3 flex items-center justify-center gap-1.5">
        <i data-lucide="clock" class="w-4 h-4 text-rosePastel"></i>
        <span>Chúng mình đã yêu nhau được</span>
      </div>

      <div class="grid grid-cols-4 gap-2 sm:gap-4 max-w-sm mx-auto">
        <div class="bg-white rounded-2xl p-2.5 sm:p-3 border border-wood/10 shadow-xs">
          <div id="days" class="text-2xl sm:text-3xl font-serif font-bold text-roseDeep">0</div>
          <div class="text-[11px] text-wood font-medium">Ngày</div>
        </div>
        <div class="bg-white rounded-2xl p-2.5 sm:p-3 border border-wood/10 shadow-xs">
          <div id="hours" class="text-2xl sm:text-3xl font-serif font-bold text-espresso">0</div>
          <div class="text-[11px] text-wood font-medium">Giờ</div>
        </div>
        <div class="bg-white rounded-2xl p-2.5 sm:p-3 border border-wood/10 shadow-xs">
          <div id="minutes" class="text-2xl sm:text-3xl font-serif font-bold text-espresso">0</div>
          <div class="text-[11px] text-wood font-medium">Phút</div>
        </div>
        <div class="bg-white rounded-2xl p-2.5 sm:p-3 border border-wood/10 shadow-xs">
          <div id="seconds" class="text-2xl sm:text-3xl font-serif font-bold text-rosePastel">0</div>
          <div class="text-[11px] text-wood font-medium">Giây</div>
        </div>
      </div>

      <div class="mt-3 text-xs text-wood">
        Kể từ ngày <span id="start-date-text" class="font-semibold text-roseDeep">14/02/2023</span>
      </div>

      <!-- Nút hành động đầu trang -->
      <div class="flex items-center justify-center gap-3 mt-5 pt-4 border-t border-wood/10">
        <button onclick="toggleUploadModal()" class="flex items-center gap-2 px-5 py-2.5 rounded-full bg-rosePastel hover:bg-roseDeep text-white font-medium text-xs sm:text-sm shadow-md transition-all active:scale-95">
          <i data-lucide="sparkles" class="w-4 h-4"></i>
          <span>+ Đăng Kỷ Niệm Mới</span>
        </button>
        <button onclick="editLoveInfo()" class="flex items-center gap-1.5 px-4 py-2 rounded-full bg-white hover:bg-beige text-wood text-xs border border-wood/20 transition-all">
          <i data-lucide="edit-3" class="w-3.5 h-3.5"></i>
          <span>Đổi ngày / Tên</span>
        </button>
      </div>
    </div>
  </header>

  <!-- FORM ĐĂNG KỶ NIỆM (MODAL POPUP) -->
  <div id="upload-modal" class="fixed inset-0 z-50 hidden flex items-center justify-center p-4 bg-black/45 backdrop-blur-xs">
    <div class="bg-[#FFFDF9] rounded-3xl p-6 sm:p-8 max-w-lg w-full border border-wood/20 shadow-2xl relative my-6 max-h-[90vh] overflow-y-auto">
      <button onclick="toggleUploadModal()" class="absolute top-5 right-5 p-2 text-wood hover:text-espresso rounded-full">
        <i data-lucide="x" class="w-5 h-5"></i>
      </button>

      <div class="mb-4">
        <span class="text-xs font-semibold text-roseDeep bg-rosePastel/15 px-3 py-1 rounded-full">Thêm Khoảnh Khắc</span>
        <h2 class="font-serif text-2xl font-bold text-espresso mt-2">Đăng Kỷ Niệm Của Hai Đứa</h2>
        <p class="text-xs text-wood">Ghi lại từng hình ảnh và cảm xúc dịu dàng</p>
      </div>

      <form id="memory-form" onsubmit="handleSaveMemory(event)" class="space-y-4">
        <!-- Tải ảnh / Chọn ảnh -->
        <div>
          <label class="block text-xs font-semibold text-wood mb-1">Ảnh kỷ niệm *</label>
          <div id="preview-container" class="hidden mb-2 relative rounded-xl overflow-hidden border border-rosePastel/30">
            <img id="image-preview" src="" alt="Xem trước" class="w-full h-48 object-cover">
            <button type="button" onclick="clearSelectedImage()" class="absolute top-2 right-2 p-1 bg-black/60 text-white rounded-full">
              <i data-lucide="x" class="w-4 h-4"></i>
            </button>
          </div>
          <input type="file" id="file-input" accept="image/*" onchange="handleImageSelect(event)" class="w-full text-xs text-wood file:mr-3 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-rosePastel/20 file:text-roseDeep hover:file:bg-rosePastel/30 cursor-pointer">
          <input type="url" id="url-input" placeholder="Hoặc dán liên kết URL ảnh..." oninput="handleUrlInput(event)" class="mt-2 w-full px-3 py-2 text-xs rounded-xl border border-wood/20 bg-white">
        </div>

        <!-- Ngày kỷ niệm & Địa điểm -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-wood mb-1">Ngày kỷ niệm *</label>
            <input type="date" id="memory-date" required class="w-full px-3 py-2 text-xs rounded-xl border border-wood/20 bg-white">
          </div>
          <div>
            <label class="block text-xs font-semibold text-wood mb-1">Địa điểm</label>
            <input type="text" id="memory-location" placeholder="Ví dụ: Tiệm cà phê nhỏ, Đà Lạt..." class="w-full px-3 py-2 text-xs rounded-xl border border-wood/20 bg-white">
          </div>
        </div>

        <!-- Khung cảm xúc nhật ký -->
        <div>
          <label class="block text-xs font-semibold text-wood mb-1">Dòng cảm xúc / Nhật ký *</label>
          <textarea id="memory-caption" rows="3" required placeholder="Hôm ấy trời xanh và nụ cười em thật dịu dàng..." class="w-full px-3 py-2 text-xs rounded-xl border border-wood/20 bg-white resize-none"></textarea>
        </div>

        <div class="flex justify-end gap-2 pt-2">
          <button type="button" onclick="toggleUploadModal()" class="px-4 py-2 text-xs text-wood rounded-xl hover:bg-beige">Hủy</button>
          <button type="submit" class="px-6 py-2 text-xs font-semibold text-white bg-rosePastel hover:bg-roseDeep rounded-xl shadow-xs transition-all">
            Lưu Kỷ Niệm
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- BẢNG KỶ NIỆM (MEMORY FEED & GALLERY) -->
  <main class="max-w-6xl mx-auto px-4 pb-20">
    <!-- Thanh tìm kiếm & lọc -->
    <div class="card-pastel rounded-2xl p-4 mb-6 flex flex-col sm:flex-row items-center justify-between gap-3">
      <div class="relative w-full sm:w-72">
        <i data-lucide="search" class="w-4 h-4 text-wood absolute left-3 top-2.5"></i>
        <input type="text" id="search-input" oninput="renderMemories()" placeholder="Tìm theo cảm xúc, địa điểm..." class="w-full pl-9 pr-3 py-1.5 text-xs rounded-xl border border-wood/20 bg-white">
      </div>

      <div class="flex items-center gap-2 w-full sm:w-auto justify-end">
        <button onclick="setFilter('Tất cả')" class="filter-btn active text-xs px-3 py-1.5 rounded-full bg-rosePastel text-white font-medium">Tất cả</button>
        <button onclick="setFilter('Hẹn hò')" class="filter-btn text-xs px-3 py-1.5 rounded-full bg-white text-wood border border-wood/15">Hẹn hò</button>
        <button onclick="setFilter('Du lịch')" class="filter-btn text-xs px-3 py-1.5 rounded-full bg-white text-wood border border-wood/15">Du lịch</button>
        <button onclick="setFilter('Kỷ niệm')" class="filter-btn text-xs px-3 py-1.5 rounded-full bg-white text-wood border border-wood/15">Kỷ niệm</button>
      </div>
    </div>

    <!-- Lưới hiển thị các thẻ ảnh kỷ niệm -->
    <div id="memory-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
      <!-- Sẽ được hiển thị bằng JavaScript -->
    </div>
  </main>

  <!-- JAVASCRIPT XỬ LÝ LƯU TRỮ VÀ GIAO DIỆN -->
  <script>
    // Dữ liệu mẫu ban đầu
    const DEFAULT_MEMORIES = [
      {
        id: '1',
        imageUrl: 'https://images.unsplash.com/photo-1518199266791-5375a83190b7?auto=format&fit=crop&w=1000&q=80',
        date: '2023-10-15',
        location: 'Tiệm Cà Phê Trong Rừng, Đà Lạt',
        caption: 'Buổi sáng se lạnh bên ly cacao nóng, ngồi nghe tiếng thông reo và ngắm nụ cười ấm áp của em.',
        tag: 'Du lịch',
        likes: 24
      },
      {
        id: '2',
        imageUrl: 'https://images.unsplash.com/photo-1516589178581-6cd7833ae3b2?auto=format&fit=crop&w=1000&q=80',
        date: '2023-12-24',
        location: 'Bờ Hồ Tây, Hà Nội',
        caption: 'Hoàng hôn buông màu hồng cam rực rỡ cả góc trời, hai đứa đạp xe quanh hồ rồi ghé ăn kem.',
        tag: 'Hẹn hò',
        likes: 31
      },
      {
        id: '3',
        imageUrl: 'https://images.unsplash.com/photo-1529156069898-49953e39b3ac?auto=format&fit=crop&w=1000&q=80',
        date: '2024-02-14',
        location: 'Góc Bếp Nhỏ Của Hai Đứa',
        caption: 'Cùng nhau nấu bữa tối ấm cúng, bật bản nhạc jazz nhẹ nhàng và cùng thổi nến kỷ niệm tròn 1 năm.',
        tag: 'Kỷ niệm',
        likes: 42
      }
    ];

    // Khởi tạo State từ LocalStorage
    let memories = JSON.parse(localStorage.getItem('standalone_memories')) || DEFAULT_MEMORIES;
    let coupleInfo = JSON.parse(localStorage.getItem('standalone_couple')) || {
      nameOne: 'Anh',
      nameTwo: 'Em',
      startDate: '2023-02-14'
    };
    let currentFilter = 'Tất cả';
    let currentImageBase64 = '';

    // Lưu vào LocalStorage
    function saveToStorage() {
      localStorage.setItem('standalone_memories', JSON.stringify(memories));
      localStorage.setItem('standalone_couple', JSON.stringify(coupleInfo));
    }

    // Đếm ngày yêu nhau
    function updateLoveCounter() {
      const start = new Date(coupleInfo.startDate).getTime();
      const now = new Date().getTime();
      const diff = Math.max(0, now - start);

      const days = Math.floor(diff / (1000 * 60 * 60 * 24));
      const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
      const minutes = Math.floor((diff / (1000 * 60)) % 60);
      const seconds = Math.floor((diff / 1000) % 60);

      document.getElementById('days').innerText = days;
      document.getElementById('hours').innerText = hours;
      document.getElementById('minutes').innerText = minutes;
      document.getElementById('seconds').innerText = seconds;

      document.getElementById('name-one').innerText = coupleInfo.nameOne;
      document.getElementById('name-two').innerText = coupleInfo.nameTwo;
      document.getElementById('start-date-text').innerText = new Date(coupleInfo.startDate).toLocaleDateString('vi-VN');
    }

    setInterval(updateLoveCounter, 1000);
    updateLoveCounter();

    // Hiển thị danh sách kỷ niệm
    function renderMemories() {
      const container = document.getElementById('memory-grid');
      const searchQuery = document.getElementById('search-input').value.toLowerCase();

      const filtered = memories.filter(m => {
        if (currentFilter !== 'Tất cả' && m.tag !== currentFilter) return false;
        if (searchQuery && !m.caption.toLowerCase().includes(searchQuery) && !m.location.toLowerCase().includes(searchQuery)) return false;
        return true;
      });

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="col-span-full py-12 text-center text-wood">
            <p class="font-serif text-lg font-bold">Chưa có kỷ niệm nào</p>
            <p class="text-xs mt-1">Hãy đăng một khoảnh khắc mới nhé!</p>
          </div>
        `;
        return;
      }

      container.innerHTML = filtered.map(m => `
        <div class="polaroid-card rounded-2xl flex flex-col justify-between">
          <div>
            <div class="rounded-xl overflow-hidden aspect-4/3 bg-beige mb-3">
              <img src="${m.imageUrl}" alt="${m.caption}" class="w-full h-full object-cover">
            </div>
            <div class="flex items-center justify-between text-xs text-wood mb-2 font-medium">
              <span>📅 ${new Date(m.date).toLocaleDateString('vi-VN')}</span>
              <span>📍 ${m.location || 'Một nơi bình yên'}</span>
            </div>
            <p class="font-handwriting text-2xl text-espresso leading-snug">
              "${m.caption}"
            </p>
          </div>
          <div class="pt-3 mt-3 border-t border-wood/10 flex items-center justify-between">
            <button onclick="likeMemory('${m.id}')" class="flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-semibold bg-beige hover:bg-rosePastel/20 text-wood">
              ❤️ ${m.likes || 0} yêu thích
            </button>
            <button onclick="deleteMemory('${m.id}')" class="text-xs text-wood/60 hover:text-rose-600">
              Xóa
            </button>
          </div>
        </div>
      `).join('');

      lucide.createIcons();
    }

    // Xử lý Thả tim
    function likeMemory(id) {
      memories = memories.map(m => m.id === id ? { ...m, likes: (m.likes || 0) + 1 } : m);
      saveToStorage();
      renderMemories();
    }

    // Xử lý Xóa
    function deleteMemory(id) {
      if (confirm('Bạn có chắc muốn xóa kỷ niệm này?')) {
        memories = memories.filter(m => m.id !== id);
        saveToStorage();
        renderMemories();
      }
    }

    // Modal Đăng Kỷ Niệm
    function toggleUploadModal() {
      const modal = document.getElementById('upload-modal');
      modal.classList.toggle('hidden');
      if (!modal.classList.contains('hidden')) {
        document.getElementById('memory-date').value = new Date().toISOString().split('T')[0];
      }
    }

    function handleImageSelect(e) {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (event) => {
          currentImageBase64 = event.target.result;
          document.getElementById('image-preview').src = currentImageBase64;
          document.getElementById('preview-container').classList.remove('hidden');
        };
        reader.readAsDataURL(file);
      }
    }

    function handleUrlInput(e) {
      if (e.target.value) {
        currentImageBase64 = e.target.value;
        document.getElementById('image-preview').src = currentImageBase64;
        document.getElementById('preview-container').classList.remove('hidden');
      }
    }

    function clearSelectedImage() {
      currentImageBase64 = '';
      document.getElementById('preview-container').classList.add('hidden');
      document.getElementById('file-input').value = '';
      document.getElementById('url-input').value = '';
    }

    function handleSaveMemory(e) {
      e.preventDefault();
      if (!currentImageBase64) {
        alert('Vui lòng chọn hoặc dán link ảnh nhé!');
        return;
      }

      const newMem = {
        id: Date.now().toString(),
        imageUrl: currentImageBase64,
        date: document.getElementById('memory-date').value,
        location: document.getElementById('memory-location').value || 'Một nơi bình yên',
        caption: document.getElementById('memory-caption').value,
        tag: 'Kỷ niệm',
        likes: 1
      };

      memories.unshift(newMem);
      saveToStorage();
      renderMemories();
      toggleUploadModal();
      clearSelectedImage();
      document.getElementById('memory-caption').value = '';
      document.getElementById('memory-location').value = '';
    }

    // Đổi ngày & Tên
    function editLoveInfo() {
      const name1 = prompt('Nhập tên người 1:', coupleInfo.nameOne) || coupleInfo.nameOne;
      const name2 = prompt('Nhập tên người 2:', coupleInfo.nameTwo) || coupleInfo.nameTwo;
      const date = prompt('Nhập ngày yêu nhau (YYYY-MM-DD):', coupleInfo.startDate) || coupleInfo.startDate;

      coupleInfo = { nameOne: name1, nameTwo: name2, startDate: date };
      saveToStorage();
      updateLoveCounter();
    }

    function setFilter(tag) {
      currentFilter = tag;
      document.querySelectorAll('.filter-btn').forEach(btn => {
        if (btn.innerText === tag) {
          btn.className = 'filter-btn active text-xs px-3 py-1.5 rounded-full bg-rosePastel text-white font-medium';
        } else {
          btn.className = 'filter-btn text-xs px-3 py-1.5 rounded-full bg-white text-wood border border-wood/15';
        }
      });
      renderMemories();
    }

    // Khởi tạo icon và danh sách khi tải trang
    lucide.createIcons();
    renderMemories();
  </script>
</body>
</html>
